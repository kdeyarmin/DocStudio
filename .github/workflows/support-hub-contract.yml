name: Support Hub publication contract

on:
  pull_request:
    paths:
      - contracts/**
      - app/**
      - package.json
      - .github/workflows/support-hub-contract.yml
  push:
    branches: [main]
    paths:
      - contracts/**
      - app/**
      - package.json
      - .github/workflows/support-hub-contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:support-hub-contract
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Audit application and build dependencies
        run: npm audit --prefix app --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
